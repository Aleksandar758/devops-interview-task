[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    storage.path  /var/log/flb

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    DB                /var/log/flb/docker.db
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[OUTPUT]
    Name              loki
    Match             docker.*
    Host              loki
    Port              3100
    Labels            job=fluent-bit,source=docker
    Line_Format       json