services:
  # 1. Nginx Web Server (HTTP/HTTPS)
  webserver:
    image: nginx:alpine
    container_name: nginx_webserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./html-http:/usr/share/nginx/html/http:ro
      - ./html-https:/usr/share/nginx/html/https:ro
    restart: always

  # 2. PostgreSQL Database with Auto-Initialization
  database:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in project/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in project/.env}
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
    restart: always

  # 3. PostgreSQL Automated Backup Lifecycle
  database-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: postgres_backup
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_CLUSTER=TRUE
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in project/.env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project/.env}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in project/.env}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./db-backups:/backup
    depends_on:
      - database
    restart: always

  # 4. Prometheus Node Exporter (System Resources Metrics)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: always

    # 5. Blackbox Exporter (Web Server Availability Probing)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox_exporter
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    ports:
      - "9115:9115"
    restart: always

  # 6. Prometheus Server (Metrics Collection & Alerting)
  prometheus:
    image: prom/prometheus:latest
    container_name: Hills_server
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter
    restart: always

  # 7. Loki log storage
  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: always

  # 8. Fluent Bit Docker log collector
  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent_bit
    volumes:
      - ./monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/var/log/flb
    depends_on:
      - loki
    restart: always

  # 9. Alertmanager (Notification Engine)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager_app
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    restart: always

  # 10. Grafana Dashboards (Data Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_ui
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in project/.env}
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: always

volumes:
  loki-data:
  fluent-bit-state:
  prometheus-data:
  grafana-data:
