<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DevOps Lab - HTTPS (Secure)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: inline-block; max-width: 500px; border: 1px solid #334155; }
        h1 { color: #10b981; margin-bottom: 10px; }
        p { font-size: 1.1em; color: #94a3b8; }
        .badge { background-color: #10b981; color: #fff; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="card">
        <h1>System Secured! 🔒</h1>
        <p>Hello from the encrypted zone! Designed and deployed by <strong>Aleksandar</strong>.</p>
        <p>SSL/TLS handshake completed successfully. Active network topology monitoring is enabled.</p>
        <span class="badge">HTTPS Secure Node</span>
    </div>
</body>
</html>
