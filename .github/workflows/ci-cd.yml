name: Infrastructure CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ansible ansible-lint yamllint

      - name: Validate YAML formatting
        run: yamllint -c .yamllint.yml ansible kubernetes project

      - name: Validate Ansible playbook
        run: ansible-playbook --syntax-check -i ansible/inventory.ini ansible/playbook.yml

      - name: Validate Docker Compose
        working-directory: project
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary kubernetes/*.yaml

      - name: Run Ansible lint
        run: ansible-lint ansible/playbook.yml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan configuration with Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/trivy-bin"
          "$RUNNER_TEMP/trivy-bin/trivy" config . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      - name: Scan repository for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [validate, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local TLS certificate
        run: |
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout project/ssl/nginx.key \
            -out project/ssl/nginx.crt \
            -subj "/CN=localhost"

      - name: Start infrastructure stack
        working-directory: project
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Check HTTP, HTTPS and PostgreSQL
        working-directory: project
        run: |
          curl --fail --silent http://127.0.0.1/
          curl --fail --silent --insecure https://127.0.0.1/
          docker compose exec -T database pg_isready -U admin -d network_db

      - name: Show service logs on failure
        if: failure()
        working-directory: project
        run: docker compose logs --no-color

      - name: Stop infrastructure stack
        if: always()
        working-directory: project
        run: docker compose down -v

  deploy:
    name: Deploy with Ansible
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Create deployment environment file
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          : "${POSTGRES_USER:?POSTGRES_USER secret is required}"
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"
          : "${POSTGRES_DB:?POSTGRES_DB secret is required}"
          : "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD secret is required}"
          printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nGRAFANA_ADMIN_PASSWORD=%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" "$GRAFANA_ADMIN_PASSWORD" > project/.env

      - name: Deploy infrastructure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          printf '[vps]\n%s ansible_user=%s\n' "$VPS_HOST" "$VPS_USER" > ansible/ci-inventory.ini
          ansible-playbook \
            -i ansible/ci-inventory.ini \
            ansible/playbook.yml
