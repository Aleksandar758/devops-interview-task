apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-webserver-config
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
      }

      server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        root /usr/share/nginx/html;
        index index.html;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <title>DevOps Kubernetes Workload</title>
    </head>
    <body>
      <h1>DevOps Kubernetes Workload</h1>
      <p>Nginx is serving this page from a Kubernetes Deployment.</p>
    </body>
    </html>